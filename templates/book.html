<!DOCTYPE html>
<html>
<head>
    <title>Book Darshan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
</head>
<body>
<div class="container mt-5">
    <h2>Book Darshan</h2>
    <form method="POST">
        <label>Darshan Type</label>
        <select name="darshan_type" class="form-control mb-3" required>
            <option value="General">General</option>
            <option value="Special Entry">Special Entry</option>
            <option value="Kalyanam">Kalyanam</option>
        </select>
        <label>Date</label>
        <input type="date" name="date" class="form-control mb-3" required>
        <label>Time Slot</label>
        <select name="time_slot" class="form-control mb-3" required>
            <option value="6AM - 8AM">6AM - 8AM</option>
            <option value="10AM - 12PM">10AM - 12PM</option>
            <option value="2PM - 4PM">2PM - 4PM</option>
        </select>
        <label>Tickets</label>
        <input type="number" name="tickets" class="form-control mb-3" min="1" max="10" required>
        <button class="btn btn-success">Next</button>
    </form>
</div>
</body>
</html>
